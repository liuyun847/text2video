[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text2video"
version = "0.1.0"
description = "文案转中间件:输入文本生成音轨、透明字幕轨与素材片段,交给 Remotion 渲染整片"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "resvg-py>=0.5.0",
]

[project.scripts]
text2video = "text2video.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text2video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
