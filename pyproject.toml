[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text2video"
version = "0.1.0"
description = "文案转视频:输入文本生成语音和滚动字幕,合成短视频"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.2.8",
]

[project.scripts]
text2video = "text2video.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text2video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
